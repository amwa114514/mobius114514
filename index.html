<script>
  // 2026-10-10 23:38 她转来公测 iPhone「大白屏，等了九秒，大退后重新打开才好」：开机那包程序卡在路上时，
  // 屏幕上只有一片浅底，看着像死了。7 秒还没开机就写一行字、给一颗「重新加载」，不用大退；开了机自己消失。
  (function () {
    if (window.__MOBIUS_HOST) return;
    var booted = function () { var r = document.getElementById('root'); return !!(r && r.firstChild) || !!document.querySelector('.mobius-splash'); };
    setTimeout(function () {
      if (booted()) return;
      var d = document.createElement('div');
      d.id = 'mobius-slow-boot';
      d.setAttribute('style', 'position:fixed;inset:0;z-index:2147483646;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F2F2F2;color:#85818b;font:14px/1.6 system-ui,-apple-system,sans-serif;text-align:center;padding:0 32px');
      d.innerHTML = '<div>网络有点慢，正在加载……</div><button type="button" style="border:0;border-radius:999px;padding:9px 22px;background:#333;color:#F9F9F9;font:inherit">重新加载</button>';
      d.querySelector('button').onclick = function () { location.reload(); };
      document.body.appendChild(d);
      // 2026-10-24 22:35：开机文件挂在半路时，浏览器要等这些请求了结才去查新版 worker（新版能从国内镜像补文件），

      try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { r && r.update(); }).catch(function () {}); } catch (e) {}
      var t = setInterval(function () { if (booted()) { clearInterval(t); d.remove(); } }, 300);

<script>
  // 宽屏：摆手机。高度照屏幕留 40px 边，宽度跟着手机比例走（430×932），再窄也不低于 360。
  // 屏幕比一台手机还大（iPad 竖着、大显示器）就整台等比放大，最多 1.3 倍——框里还是 430 宽的世界，只是看着大；
  // 不往小缩，缩了字就太小，矮屏宁可把框变矮。
  if (window.__MOBIUS_HOST) {
    var f = document.createElement('iframe');
    f.id = 'mobius-frame';
    f.title = 'Möbius';
    f.allow = 'microphone; camera; geolocation; autoplay; fullscreen; clipboard-read; clipboard-write; screen-wake-lock; web-share';
    f.src = location.href;
    var fit = function () {
      var h = Math.min(932, innerHeight - 40);
      var w = Math.max(360, Math.min(430, Math.round(h * 430 / 932)));
      document.documentElement.style.setProperty('--fh', h + 'px');
      document.documentElement.style.setProperty('--fw', w + 'px');
      var k = Math.max(1, Math.min(1.3, (innerHeight - 40) / h, (innerWidth - 40) / w));
      document.documentElement.style.setProperty('--fk', String(k));
    };
    fit(); addEventListener('resize', fit);
    document.body.appendChild(f);

</script>
<script>
  // 安卓 APK（2026-10-16 她：「干活！」）：程序整套装在 APK 里，从 https://localhost 本地读，开机不用再去国外下。
  // 但激活、同步、转发这些是 mobiusphone.pages.dev 上的服务器函数，本地没有——相对路径的请求在这里改道过去。
  // 网页版的地址永远不是 https://localhost（本地调试是 http://localhost:5189），所以网页一个字节都不受影响。
  (function () {
    if (location.origin !== 'https://localhost') return;
    window.__MOBIUS_APK = true;
    var SITE = 'https://mobiusphone.pages.dev';
    var ROUTES = ['/warehouse-api/', '/act/', '/relay', '/mcp-relay', '/unfurl', '/sticker-image', '/font-file', '/yt', '/bili', '/api/ne/', '/dav', '/github-backup', '/ios-share/'];
    var raw = window.fetch.bind(window);
    window.fetch = function (input, init) {
      if (typeof input === 'string' && input.charAt(0) === '/' && ROUTES.some(function (r) { return input.indexOf(r) === 0; })) {
        input = SITE + input;
      }
      return raw(input, init);
    };

    // 下载：网页用 <a download> + blob 链接存备份、存图，安卓 WebView 对它什么都不做。
    // 这里把文件读出来分块交给壳子（android/.../FileSaver.java），存进手机的「下载/Möbius」。
    function savable(a) {
      return a && a.hasAttribute('download') && /^(blob:|data:|https:\/\/localhost\/)/.test(a.href);
    }
    function b64(part) {
      return new Promise(function (ok, no) {
        var r = new FileReader();
        r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
        r.onerror = no;
        r.readAsDataURL(part);
      });
    }
    function save(href, name) {
      var C = window.Capacitor;
      if (!C || !C.nativePromise) return false;
      var call = function (m, o) { return C.nativePromise('MobiusFiles', m, o); };
      raw(href).then(function (r) { return r.blob(); }).then(async function (b) {
        var o = await call('begin', { name: name || 'Möbius', mime: b.type || '' });
        if (!o || !o.id) throw new Error('begin');
        for (var i = 0; i < b.size; i += 768 * 1024) {
          var a = await call('append', { id: o.id, data: await b64(b.slice(i, i + 768 * 1024)) });
          if (!a || !a.ok) throw new Error('append');
        }
        var f = await call('finish', { id: o.id });
        if (!f || !f.ok) throw new Error('finish');
      }).catch(function () { alert('没存上，再试一次'); });
      return true;
    }
    var click = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function () {
      if (savable(this) && save(this.href, this.getAttribute('download'))) return;
      return click.call(this);
    };
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[download]');
      if (savable(a) && save(a.href, a.getAttribute('download'))) e.preventDefault();
    }, true);

    // 电量栏、手势条那两条由壳子让出来（MainActivity.keepOutOfSystemBars），颜色跟着整机底色走：换主题一秒内跟上
    var lastBar = '';
    function paintBars() {
      var C = window.Capacitor;
      if (!C || !C.nativePromise || !document.body) return;
      var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/.exec(getComputedStyle(document.body).backgroundColor);
      if (!m || (m[4] !== undefined && Number(m[4]) === 0)) return;
      var hex = '#' + [m[1], m[2], m[3]].map(function (n) { return ('0' + Number(n).toString(16)).slice(-2); }).join('');
      if (hex === lastBar) return;
      lastBar = hex;
      C.nativePromise('MobiusBars', 'setColor', { color: hex }).catch(function () { lastBar = ''; });
    }
    setInterval(paintBars, 1000);
    document.addEventListener('DOMContentLoaded', paintBars);
  })();
</script>

  window.__mobiusUpdateCard = function (apply, iosHome, later) {
    if (window.top !== window || document.getElementById('mobius-update-pill')) return;

    buttons[0].onclick = function () { card.remove(); if (later) later(); };
    buttons[1].onclick = function () {
      if (iosHome) { card.remove(); return; }
      buttons[0].disabled = buttons[1].disabled = true;
      buttons[1].textContent = '更新中…';
      Promise.resolve().then(apply).catch(function () {
        note.textContent = '更新未完成，请检查保存状态后重试';

<script>
  // 2026-09-08 她：「codex推每次都没有，哪儿看都没有」。线上查过是新的，
  // 剩下的唯一变量就是这台 worker——它不主动更新，桌面上那份可以一直守着旧壳。
  // 三道保险：①每次打开主动 update() ②每小时再探一次 ③新 worker 一接管就自己刷一次页。
  // APK 里不装 worker：程序已经在本地，更新由壳子换整包，worker 的缓存只会挡着新版。
  if ('serviceWorker' in navigator && !window.__MOBIUS_APK) {
    // 新 worker 接管时不再把正在播放的开屏硬刷新一遍。
    // 当前会话继续跑，下一次自然打开会拿到新壳；这样不会出现动画转一圈→白一下→从头再播。
    // 2026-10-21 23:31 她：「每次都要进来好久，退出好几次都没有弄好，他就不能一下就弄好吗」。
    // 原来新版在后台下好、新 worker 接管以后一声不吭，只能等下一次冷启动碰运气，退一次不一定够。
    // 现在：①从别的软件切回来也去查一次（不用大退） ②新 worker 接管＝新版开机包已经整包下进手机了
    // （sw.js install 里 adoptHome 下齐才算装好），这时底下冒一条「点一下换上」，点了就刷新，一次到位。
    // 第一次装 worker（原来没有 controller）不算更新，不冒。
    var hadController = !!navigator.serviceWorker.controller;
    function showUpdatePill() {
      // 电脑宽屏会把同一张页面再装进 #mobius-frame 手机框里，框里那份别再冒一条（外层刷新会连它一起换）
      // 2026-10-25 买家 iOS 18.7：点了「换上」在页面里原地刷新，回来带键盘的地方全点不动，从后台划掉重开才好。
      // iPhone 装到桌面（navigator.standalone）就不原地刷新了，只提示划掉重开；新 worker 已接管，重开就是新版。
      var iosHome = navigator.standalone === true;
      // 2026-10-25：先等手头没存完的图落完再刷新（src/engine/pending-writes.ts，最多 4 秒），装修到一半点了别丢
      window.__mobiusUpdateCard(function () {
        var app = document.getElementById('mobius-frame');
        var owner = app && app.contentWindow || window;
        return Promise.resolve(owner.__mobiusFlush && owner.__mobiusFlush()).then(function () { location.reload(); });
      }, iosHome);

    }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      try { sessionStorage.setItem('mobius-sw-updated', '1'); } catch (_) {}
      if (hadController) showUpdatePill();
      hadController = true;
    });
    addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function (reg) {
        reg.update();
        setInterval(function () { reg.update(); }, 3600000);
        var lastCheck = Date.now();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState !== 'visible' || Date.now() - lastCheck < 30000) return;
          lastCheck = Date.now();
          reg.update().catch(function () {});
        });
      }).catch(function () { /* 装不上就当普通网页用，不影响打开 */ });
    });
  }
</script>
